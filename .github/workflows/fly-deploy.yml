# Fly.io continuous deployment — triggers on every push to main.
# Required secret: FLY_API_TOKEN  (Settings → Secrets → Actions)
# Generate at: https://fly.io/user/personal_access_tokens

name: Test & Deploy
on:
  push:
  pull_request:
jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pytest (fails under 80% coverage)
        run: python -m pytest --cov --cov-config=.coveragerc --cov-fail-under=80 -p no:warnings

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: vitest (fails under 80% coverage)
        run: npm run test:coverage

  deploy:
    name: Deploy app
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-group    # one deploy at a time
    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify FLY_API_TOKEN is set
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "❌  FLY_API_TOKEN secret is not set."
            echo "    Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "    Generate a token at: https://fly.io/user/personal_access_tokens"
            exit 1
          fi
          echo "✅  FLY_API_TOKEN is present (${#FLY_API_TOKEN} chars)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --verbose
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
